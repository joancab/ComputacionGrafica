<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de contacto</title>
<link rel="stylesheet" href="formulario.css">
</head>
<body>
<section class="form-section">
<div class="form-container">
<header class="form-header">
<span class="eyebrow">CONTACTO</span>
<h1>Cuéntenos sobre su necesidad</h1>
<p>Complete el formulario. Los campos marcados con <strong>*</strong> son obligatorios.</p>
</header>
<form class="contact-form" action="#" method="post">

<section>
<h2>Datos personales</h2>
<div class="form-grid">
<div class="form-field">
<label for="nombre">Nombre <span class="required-mark">*</span></label>
<input type="text" id="nombre" name="nombre" placeholder="Laura" required>
</div>
<div class="form-field">
<label for="apellido">Apellido <span class="required-mark">*</span></label>
<input type="text" id="apellido" name="apellido" placeholder="Martínez" required>
</div>
</div>
<div class="form-grid">
<div class="form-field">
<label for="email">Correo <span class="required-mark">*</span></label>
<input type="email" id="email" name="email" placeholder="nombre@empresa.com" required>
</div>
<div class="form-field">
<label for="telefono">Teléfono</label>
<input type="tel" id="telefono" name="telefono" placeholder="+57 300 000 0000">
</div>
</div>
</section>

<section>
<h2>Organización</h2>
<div class="form-grid">
<div class="form-field">
<label for="empresa">Empresa</label>
<input type="text" id="empresa" name="empresa">
</div>
<div class="form-field">
<label for="empleados">Número de empleados</label>
<input type="number" id="empleados" name="empleados" min="1">
</div>
</div>
<div class="form-field">
<label for="servicio">Servicio de interés <span class="required-mark">*</span></label>
<select id="servicio" name="servicio" required>
<option value="" selected disabled>Seleccione un servicio</option>
<optgroup label="Auditorías de Seguridad">
<option value="pentesting">Pentesting</option>
<option value="hacking-etico">Hacking Ético</option>
<option value="iso27001">ISO 27001</option>
</optgroup>
<optgroup label="Desarrollo Seguro">
<option value="ssdlc">SSDLC</option>
<option value="devsecops">DevSecOps</option>
<option value="ai-security">AI Security</option>
</optgroup>
</select>
</div>
</section>

<section>
<h2>Disponibilidad</h2>
<div class="form-grid">
<div class="form-field">
<label for="fecha">Fecha preferida</label>
<input type="date" id="fecha" name="fecha">
</div>
<div class="form-field">
<label for="hora">Hora preferida</label>
<input type="time" id="hora" name="hora">
</div>
</div>
</section>

<fieldset>
<legend>Modalidad de contacto</legend>
<div class="choice-list">
<label class="choice"><input type="radio" name="modalidad" value="correo" checked>Correo electrónico</label>
<label class="choice"><input type="radio" name="modalidad" value="telefono">Teléfono</label>
<label class="choice"><input type="radio" name="modalidad" value="videollamada">Videollamada</label>
</div>
</fieldset>

<fieldset>
<legend>Temas adicionales de interés</legend>
<div class="choice-list">
<label class="choice"><input type="checkbox" name="intereses" value="seguridad">Seguridad de aplicaciones</label>
<label class="choice"><input type="checkbox" name="intereses" value="cloud">Cloud Security</label>
<label class="choice"><input type="checkbox" name="intereses" value="ia">AI Security</label>
</div>
</fieldset>

<div class="form-field">
<label for="mensaje">Describa su necesidad <span class="required-mark">*</span></label>
<textarea id="mensaje" name="mensaje" rows="6" maxlength="1200" placeholder="Cuéntenos brevemente qué necesita..." required></textarea>
<small class="field-help">Máximo 1200 caracteres.</small>
</div>

<div class="form-field">
<label for="archivo">Documento de soporte</label>
<input type="file" id="archivo" name="archivo" accept=".pdf,.doc,.docx,.xlsx">
<small class="field-help">Formatos sugeridos: PDF, Word o Excel.</small>
</div>

<label class="choice">
<input type="checkbox" name="terminos" required>
Acepto el tratamiento de la información suministrada.
</label>

<div class="form-actions">
<button type="submit" class="button button-primary">Enviar solicitud</button>
<button type="reset" class="button button-secondary">Limpiar</button>
</div>

</form>
</div>
</section>
</body>
</html>
