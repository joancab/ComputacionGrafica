<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soporte</title>
<link rel="stylesheet" href="Style5.css">
</head>
<body>
<div class="card">
<h1>Contactar soporte</h1>
<form action="#" method="post">
<div class="form-field">
<label for="prioridad">Prioridad</label>
<select id="prioridad" name="prioridad" required>
<option value="" selected disabled>Seleccione una opción</option>
<option value="baja">Baja</option>
<option value="media">Media</option>
<option value="alta">Alta</option>
</select>
</div>
<div class="form-field">
<label for="mensaje">Describa el problema</label>
<textarea id="mensaje" name="mensaje" rows="5" required></textarea>
</div>
<div class="form-field">
<label for="archivo">Adjuntar evidencia</label>
<input type="file" id="archivo" name="archivo" accept="image/*,.pdf">
</div>
<button type="submit">Enviar caso</button>
</form>
</div>
</body>
</html>
